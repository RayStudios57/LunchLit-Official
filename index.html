  <body>
    <div id="root"></div>
    <script>
      // Recovery shim: if the page can't load (often Safari/Mac with stale service worker),
      // visiting ?reset=sw will unregister the SW and clear caches.
      // Also auto-recover if a fatal error happens before React mounts.
      (function () {
        try {
          if (location.search.includes('reset=sw') && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
              if (window.caches) caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); }))
                  .then(function () { location.replace(location.pathname); });
              }); else { location.replace(location.pathname); }
            });
          }
          var booted = false;
          window.addEventListener('load', function () {
            setTimeout(function () {
              var root = document.getElementById('root');
              if (!root || root.childElementCount === 0) {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function (regs) {
                    if (regs.length && !sessionStorage.getItem('lunchlit_sw_recovered')) {
                      sessionStorage.setItem('lunchlit_sw_recovered', '1');
                      regs.forEach(function (r) { r.unregister(); });
                      if (window.caches) caches.keys().then(function (keys) {
                        Promise.all(keys.map(function (k) { return caches.delete(k); }))
                          .then(function () { location.reload(); });
                      });
                    }
                  });
                }
              } else { booted = true; }
            }, 4000);
          });
        } catch (e) { /* no-op */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
